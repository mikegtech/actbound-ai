name: Security

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    name: Workflow Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Script URL pinned to the v1.7.7 release commit to avoid mutable main-branch fetch.
      - name: Download actionlint
        shell: bash
        run: |
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --output download-actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash
          bash download-actionlint.bash 1.7.7

      - name: Run actionlint
        run: ./actionlint -color
        shell: bash

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      # Pin to a versioned tag. Update periodically with: gh api repos/semgrep/semgrep/releases/latest --jq '.tag_name'
      image: semgrep/semgrep:1.155.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Semgrep
        run: semgrep scan --metrics=off --config p/default --config p/javascript --error --quiet
