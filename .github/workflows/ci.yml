name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Syncpack lint
        run: pnpm syncpack:lint

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # TODO: Enable when test suite exists
      # - name: Test
      #   run: pnpm test
