# Pre-commit hooks for ActBound AI monorepo
#
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Update:   pre-commit autoupdate
# Run all:  pre-commit run --all-files
# Skip:     SKIP=eslint git commit -m "wip"  (use sparingly)

repos:
  # ── File hygiene (fast, language-agnostic) ──────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]
      - id: detect-private-key
      - id: check-symlinks

  # ── Secret scanning (gitleaks) ──────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── Local hooks (use repo tooling, run on staged files) ─────────────
  - repo: local
    hooks:
      - id: prettier
        name: prettier (auto-format staged files)
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, markdown, yaml]
        pass_filenames: true

      - id: eslint
        name: eslint
        entry: pnpm exec eslint --max-warnings=0
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true

      - id: syncpack
        name: syncpack (dependency version consistency)
        entry: pnpm syncpack:lint
        language: system
        pass_filenames: false
        files: (^|/)package\.json$

  # ── Pre-push hooks (heavier validation) ─────────────────────────────
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck (tsc --noEmit across packages)
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
